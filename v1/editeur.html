<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://docs.getgrist.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Éditeur de questionnaire DSFR – widget Grist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css" integrity="sha384-pSuXpWGkpqKPyjAvU65RYbgM3zqf8TFZLBvox8Ykh2FqYyjnDbN7H+QUVrYIhOTa" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/icons/icons.min.css" integrity="sha384-S+ttVpcWWHLn1CEGnBmT+A2KKDlXcNJ/vo6Qh/XYK7/0Lo+X/gM2k1vf5fDkssFu" crossorigin="anonymous">
  <link rel="stylesheet" href="css/commun.css?v=4">
  <link rel="stylesheet" href="css/page.css?v=3">
  <link rel="stylesheet" href="css/editeur.css?v=4">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <div class="ed-barre">
    <div class="ed-barre__titre">
      <p class="ed-nom">Questionnaire DSFR</p>
      <p class="fr-badge fr-badge--sm" id="etat">Chargement…</p>
    </div>
    <fieldset class="fr-segmented fr-segmented--sm" id="onglets">
      <legend class="fr-segmented__legend fr-sr-only">Vue de l'éditeur</legend>
      <div class="fr-segmented__elements">
        <div class="fr-segmented__element">
          <input value="questions" checked type="radio" id="onglet-questions" name="onglet">
          <label class="fr-label" for="onglet-questions">Questions</label>
        </div>
        <div class="fr-segmented__element">
          <input value="textes" type="radio" id="onglet-textes" name="onglet">
          <label class="fr-label" for="onglet-textes">Textes</label>
        </div>
        <div class="fr-segmented__element">
          <input value="page" type="radio" id="onglet-page" name="onglet">
          <label class="fr-label" for="onglet-page">En-tête et pied</label>
        </div>
        <div class="fr-segmented__element">
          <input value="apercu" type="radio" id="onglet-apercu" name="onglet">
          <label class="fr-label" for="onglet-apercu">Aperçu</label>
        </div>
        <div class="fr-segmented__element">
          <input value="publication" type="radio" id="onglet-publication" name="onglet">
          <label class="fr-label" for="onglet-publication">Publication</label>
        </div>
      </div>
    </fieldset>
    <button type="button" class="fr-btn fr-btn--sm fr-icon-save-line fr-btn--icon-left" id="enregistrer">Enregistrer</button>
  </div>
  <div id="message" class="ed-message" aria-live="polite"></div>
  <main id="vue" class="ed-vue"></main>

  <script src="js/page-dsfr.js?v=3"></script>
  <script src="js/page-editeur.js?v=1"></script>
  <script src="js/moteur.js?v=6"></script>
  <script src="js/rendu.js?v=5"></script>
  <script src="js/editeur.js?v=7"></script>
</body>
</html>
